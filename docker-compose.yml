

networks:
  hr-lookout-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  minio-data:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hr-lookout-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-hr_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hr_secure_pass_2024}
      POSTGRES_MULTIPLE_DATABASES: ${DATABASE_NAME:-hr_core},payroll_db,hr_lookout
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    networks:
      - hr-lookout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-hr_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hr-lookout-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2024}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - hr-lookout-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: hr-lookout-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-mongo_secure_pass_2024}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-hr_logs}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - hr-lookout-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: hr-lookout-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_secure_pass_2024}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    networks:
      - hr-lookout-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: hr-lookout-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2024}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - hr-lookout-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO Initialization
  minio-init:
    image: minio/mc:latest
    container_name: hr-lookout-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2024};
      mc mb myminio/hr-documents --ignore-existing;
      mc mb myminio/hr-reports --ignore-existing;
      mc anonymous set download myminio/hr-reports;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - hr-lookout-network

  # HR Core Service (Django) - KEYCLOAK REMOVED
  hr-core:
    build:
      context: ./services/hr-core
      dockerfile: Dockerfile
    container_name: hr-lookout-hr-core
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here-change-in-production}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-hr_core}
      - DATABASE_USER=${DATABASE_USER:-hr_admin}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-hr_secure_pass_2024}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_pass_2024}
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=${MONGODB_USER:-mongo_admin}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-mongo_secure_pass_2024}
      - MONGODB_DB=${MONGODB_DB:-hr_logs}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_secure_pass_2024}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minio_secure_pass_2024}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    volumes:
      - ./services/hr-core:/app
      - ./media:/app/media
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - hr-lookout-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-core.rule=Host(`hr-core.localhost`)"
      - "traefik.http.routers.hr-core.entrypoints=web"
      - "traefik.http.services.hr-core.loadbalancer.server.port=8000"

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: hr-lookout-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - hr-lookout-network
    restart: unless-stopped
